- name: SearchResult
  route: /wp/v2/search
  operations: [searchContent]
  count_observed: 60
  description: >-
    A projection, not a stored entity — a lightweight hit (id, title, url, type, subtype)
    across all searchable content, with an embeddable _links.self to the full object.
relationship_traversal:
  mechanism: _links + _embed
  detail: >-
    Every object carries a _links map (self, collection, about, author, wp:featuredmedia,
    wp:attachment, wp:term, replies). Appending _embed to a request inlines those linked
    objects under _embedded, resolving author, featured media and terms in a single round
    trip instead of one call per relationship. The author relation will not resolve for
    anonymous callers.
