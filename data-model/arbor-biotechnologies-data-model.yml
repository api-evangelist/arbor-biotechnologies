note: >-
  Entity graph of the WordPress content model as this site actually exposes it. Relationships
  were derived from id-reference fields present in real responses (author, categories, tags,
  featured_media, parent, post) and from /wp/v2/taxonomies and /wp/v2/types — not from a
  published object reference, because Arbor publishes none.
id_scheme:
  type: integer
  prefixed: false
  detail: >-
    Bare auto-increment integers, unique within a post type or taxonomy rather than globally.
    An id alone does not identify its entity — always carry the collection with it. Posts and
    attachments share the WordPress posts table, so their ids are drawn from one sequence,
    but a page id will still 404 against /wp/v2/media.
entities:
- name: Post
  route: /wp/v2/posts
  operations: [listPosts, getPost]
  count_observed: 59
  date_range_observed: 2018 to 2026-06-25
  description: >-
    Arbor's press releases and company announcements — financings, partnership news
    (Chiesi, Vertex, Allogene, Samsung Life Science Fund), regulatory designations for
    ABO-101, conference presentations (ASGCT) and executive appointments. This is the
    substantive machine-readable content on the site.
  key_fields: [id, date, date_gmt, modified, modified_gmt, slug, status, link, title, content,
    excerpt, author, featured_media, categories, tags, format, sticky, meta, acf, class_list,
    yoast_head, yoast_head_json, _links]
  relationships:
  - {type: belongs_to, target: User, via: author, note: resolves to an id only; /wp/v2/users is 401 anonymously}
  - {type: has_one, target: Media, via: featured_media}
  - {type: has_many, target: Category, via: categories}
  - {type: has_many, target: Tag, via: tags, note: always empty on this site}
- name: Page
  route: /wp/v2/pages
  operations: [listPages, getPage]
  count_observed: 11
  description: >-
    The static site: clinical-trial, pipeline, what-we-do, who-we-are, inside-arbor,
    stay-updated, get-in-touch, site-map, privacy-policy, terms-of-use and the home page.
  key_fields: [id, date, slug, status, link, title, content, excerpt, author, featured_media,
    parent, menu_order, template, meta, acf, yoast_head, yoast_head_json, _links]
  relationships:
  - {type: belongs_to, target: User, via: author}
  - {type: has_one, target: Media, via: featured_media}
  - {type: belongs_to, target: Page, via: parent, note: all 11 pages are top level (parent 0) in the REST view, even though the site menu nests them}
- name: Media
  route: /wp/v2/media
  operations: [listMedia, getMedia]
  count_observed: 4
  count_reported: 394
  description: >-
    The media library — logos, leadership headshots, pipeline graphics and press assets.
