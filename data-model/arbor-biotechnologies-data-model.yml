    restricted. Direct file URLs under /wp-content/uploads/ remain publicly fetchable and are
    explicitly Allowed in robots.txt.
  key_fields: [id, date, slug, link, title, author, media_type, mime_type, source_url,
    media_details, alt_text, caption, post, _links]
  relationships:
  - {type: belongs_to, target: User, via: author}
  - {type: belongs_to, target: Post, via: post, note: the object the file was uploaded to}
