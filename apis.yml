apis:
- aid: arbor-biotechnologies:arbor-biotechnologies-content-api
  name: Arbor Biotechnologies Content API (WordPress REST)
  description: >-
    Read-only, anonymously accessible WordPress REST API served by the Arbor Biotechnologies
    corporate site at https://arbor.bio/wp-json. It exposes the company's press releases and
    announcements (59 posts, 2018-2026), the 11 static site pages covering the pipeline,
    platform, leadership and clinical program, 11 categories, the media library, cross-content
    search, oEmbed and Yoast SEO / schema.org metadata. This is an incidental content management
    surface, not a first-party API product: Arbor publishes no developer documentation, issues no
    keys, offers no SDKs or support channel for it, and every write, user, settings, plugin, theme
    and site-health route returns 401 to anonymous callers while comments return 403.
  humanURL: https://arbor.bio/stay-updated/
  baseURL: https://arbor.bio/wp-json
