x-enrichment:
  date: '2026-07-31'
  status: enriched
  artifacts_added: 12
  pass: local-v1
  notes: >-
    No product API. Contract discovery probed arbor.bio and www.arbor.bio plus eight
    non-resolving subdomains (api, developer, docs, status, trust, mcp, app, portal) for
    OpenAPI, GraphQL, MCP tools/list, A2A agent cards and the full /.well-known/ set — all 404
    or NXDOMAIN. The one real machine-readable contract found is the site's anonymous
    WordPress REST API at https://arbor.bio/wp-json (18 namespaces, 341 declared routes); an
    OpenAPI 3.1 covering 21 individually verified anonymous read operations was derived from
    that live route index. No packages, MCP server, agent card, OAuth scopes,
    vulnerability-disclosure programme or trust center exist; those artifacts were
    deliberately not written rather than stubbed, and no WellKnown pointer was emitted
    because every /.well-known/ probe returned 404.
