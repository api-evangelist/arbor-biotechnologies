aid: arbor-biotechnologies
name: Arbor Biotechnologies
description: >-
  Arbor Biotechnologies is a next-generation gene editing company founded in 2016 by Feng Zhang,
  David Walt, David Scott and Winston Yan, and headquartered in Cambridge, Massachusetts. Its
  proprietary AI- and machine-learning-guided discovery engine has produced a toolbox of
  programmable DNA editors spanning knockdown, nuclease excision and compact reverse-transcriptase
  editing, aimed at functionally curative genomic medicines. The wholly-owned pipeline is focused
  on liver disease (ABO-101 for primary hyperoxaluria type 1 and ABO-103, both LNP-delivered and
  partnered with Chiesi Group) and CNS disease (ABO-202, ABO-203 and ABO-204 for ALS, plus
  ABO-206, all AAV-delivered), alongside collaborative ex vivo cell therapy programs run with
  Vertex, Allogene, Edigene and Chiesi. Investors include ARCH Venture Partners, Ally Bridge
  Group, Temasek, TCG and the Samsung Life Science Fund. Arbor operates no product or developer
  API and publishes no developer portal, SDKs or API documentation; its corporate site does serve
  the standard WordPress REST API anonymously, which makes its press releases, site pages and
  taxonomies machine-readable.
