transport_anomalies:
- status: 406
  title: Not Acceptable returned by the site security layer
  observed: true
  detail: >-
    Requests carrying a non-browser User-Agent receive HTTP 406 while the correct JSON body
    is still returned. This is the site's WAF, not a WordPress REST error — there is no
    `code` field in these responses. Send a normal browser User-Agent to get a clean 200.
  remediation: Set a browser User-Agent header; do not treat 406 as a content-negotiation failure.
